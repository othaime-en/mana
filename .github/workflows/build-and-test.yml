name: Build and Test

on:
  workflow_call:
    inputs:
      push-images:
        description: 'Whether to push images to registry'
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: 'Generated version tag'
        value: ${{ jobs.build.outputs.version }}
      image_tag:
        description: 'Full image tag'
        value: ${{ jobs.build.outputs.image_tag }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/sample-app
  ORCHESTRATOR_URL: ${{ secrets.ORCHESTRATOR_URL }}

jobs:
  orchestrator-tests:
    name: Orchestrator Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: orchestrator/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage gate
        run: python -m pytest tests -v --cov=src --cov-report=term-missing --cov-fail-under=75

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive version from commit
        id: version
        run: |
          VERSION="v${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Derived version: $VERSION"

      # Python testing and linting
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Cache Python dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./sample-app
        run: |
          pip install -r requirements-dev.txt
          pip install flake8==7.4.1 black==26.10.1

      - name: Run linting
        working-directory: ./sample-app
        run: |
          flake8 src/ --max-line-length=100 --extend-ignore=E203,W503
          black --check src/

      - name: Run tests with coverage
        working-directory: ./sample-app
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./sample-app/coverage.xml
          flags: unittests
        continue-on-error: true

      # Docker build and test
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build sample-app
      - name: Build sample-app image
        id: build-app
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./sample-app
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Test sample-app container
      - name: Test sample-app container
        run: |
          docker run -d --name test-container \
            -p 5000:5000 \
            -e ENVIRONMENT=test \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          
          if ! timeout 30 bash -c 'until docker exec test-container curl -f http://localhost:5000/health; do sleep 2; done'; then
            echo "Container failed health check"
            docker logs test-container
            docker stop test-container || true
            docker rm test-container || true
            exit 1
          fi

          docker exec test-container curl -f http://localhost:5000/
          docker exec test-container curl -f http://localhost:5000/api/data
          
          docker stop test-container
          docker rm test-container

      # Build orchestrator
      - name: Build orchestrator image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./orchestrator
          push: ${{ inputs.push-images }}
          load: ${{ !inputs.push-images }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/orchestrator:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository }}/orchestrator:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Push sample-app (if enabled)
      - name: Push sample-app image
        if: inputs.push-images
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./sample-app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Notify on failures
      - name: Notify orchestrator on failure
        if: failure() && env.ORCHESTRATOR_URL != ''
        continue-on-error: true
        env:
          MANA_WEBHOOK_SECRET: ${{ secrets.MANA_WEBHOOK_SECRET }}
          MANA_DEPLOYMENT_ID: ci-${{ github.run_id }}
          MANA_NAMESPACE: ci
          MANA_VERSION: ${{ steps.version.outputs.version }}
          MANA_STATUS: failed
          BUILD_OUTCOME: ${{ steps.build-app.outcome }}
        run: |
          MANA_FAILURE_TYPE="build_failure"
          if [ "$BUILD_OUTCOME" != "failure" ]; then
            MANA_FAILURE_TYPE="test_failure"
          fi
          export MANA_FAILURE_TYPE
          scripts/notify-orchestrator.sh
