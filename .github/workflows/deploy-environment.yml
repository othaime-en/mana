name: Deploy to Environment

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (staging/production)'
        required: true
        type: string
      version:
        description: 'Version to deploy'
        required: true
        type: string
      namespace:
        description: 'Kubernetes namespace'
        required: true
        type: string
      smoke-tests:
        description: 'Run smoke tests after deployment'
        required: false
        type: boolean
        default: false
      health-check-timeout:
        description: 'Health check timeout in seconds'
        required: false
        type: number
        default: 30

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/sample-app
  ORCHESTRATOR_URL: ${{ secrets.ORCHESTRATOR_URL }}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    environment:
      name: ${{ inputs.environment }}
      url: http://sample-app.${{ inputs.environment }}.local

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive deployment identity
        id: identity
        env:
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          echo "deployment_id=deploy-${GITHUB_RUN_ID}-${NAMESPACE}" >> "$GITHUB_OUTPUT"

      - name: Set up kubectl
        uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8 # v3.2
        with:
          version: "v1.28.0"

      - name: Configure kubectl
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo "Error: KUBE_CONFIG secret not configured"
            exit 1
          fi

          umask 077
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
          KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl cluster-info

      - name: Notify deployment start
        if: env.ORCHESTRATOR_URL != ''
        continue-on-error: true
        env:
          MANA_WEBHOOK_SECRET: ${{ secrets.MANA_WEBHOOK_SECRET }}
          MANA_DEPLOYMENT_ID: ${{ steps.identity.outputs.deployment_id }}
          MANA_NAMESPACE: ${{ inputs.namespace }}
          MANA_VERSION: ${{ inputs.version }}
          MANA_STATUS: in_progress
          MANA_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: scripts/notify-orchestrator.sh

      - name: Deploy application
        id: deploy
        env:
          NAMESPACE: ${{ inputs.namespace }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}
        run: |
          kubectl set image deployment/sample-app "sample-app=${IMAGE}" -n "$NAMESPACE"

          kubectl rollout status deployment/sample-app -n "$NAMESPACE" --timeout=10m

      - name: Health check
        id: health
        env:
          NAMESPACE: ${{ inputs.namespace }}
          HEALTH_CHECK_TIMEOUT: ${{ inputs.health-check-timeout }}
        run: |
          sleep "$HEALTH_CHECK_TIMEOUT"

          READY_PODS=$(kubectl get pods -n "$NAMESPACE" -l app=sample-app -o json | \
            jq '[.items[] | select(.status.phase=="Running" and (.status.conditions // [] | any(.type=="Ready" and .status=="True")))] | length')
          TOTAL_PODS=$(kubectl get deployment sample-app -n "$NAMESPACE" -o jsonpath='{.spec.replicas}')

          echo "Ready pods: $READY_PODS / $TOTAL_PODS"

          if [ "$READY_PODS" -eq "$TOTAL_PODS" ]; then
            echo "✓ Health check passed"
            exit 0
          else
            echo "✗ Health check failed"
            kubectl get pods -n "$NAMESPACE" -l app=sample-app
            kubectl describe pods -n "$NAMESPACE" -l app=sample-app
            exit 1
          fi

      - name: Run smoke tests
        id: smoke
        if: inputs.smoke-tests
        env:
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          kubectl port-forward -n "$NAMESPACE" service/sample-app-service 8080:80 &
          PF_PID=$!
          sleep 5

          TESTS_PASSED=true

          echo "Testing /health..."
          curl -f http://localhost:8080/health || TESTS_PASSED=false

          echo "Testing /..."
          curl -f http://localhost:8080/ || TESTS_PASSED=false

          echo "Testing /api/data..."
          curl -f http://localhost:8080/api/data || TESTS_PASSED=false

          echo "Testing /api/config..."
          curl -f http://localhost:8080/api/config || TESTS_PASSED=false

          kill $PF_PID || true

          if [ "$TESTS_PASSED" = true ]; then
            echo "✓ All smoke tests passed"
          else
            echo "✗ Some smoke tests failed"
            exit 1
          fi

      - name: Determine deployment status
        id: status
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" == "success" ] && \
             [ "${{ steps.health.outcome }}" == "success" ] && \
             [ "${{ steps.smoke.outcome }}" != "failure" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "failure_type=" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.health.outcome }}" == "failure" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "failure_type=health_check_failure" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.deploy.outcome }}" == "failure" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "failure_type=deployment_failure" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "failure_type=smoke_test_failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify deployment result
        if: always() && env.ORCHESTRATOR_URL != ''
        continue-on-error: true
        env:
          MANA_WEBHOOK_SECRET: ${{ secrets.MANA_WEBHOOK_SECRET }}
          MANA_DEPLOYMENT_ID: ${{ steps.identity.outputs.deployment_id }}
          MANA_NAMESPACE: ${{ inputs.namespace }}
          MANA_VERSION: ${{ inputs.version }}
          MANA_STATUS: ${{ steps.status.outputs.status }}
          MANA_FAILURE_TYPE: ${{ steps.status.outputs.failure_type }}
          MANA_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: scripts/notify-orchestrator.sh
