name: Security Scanning

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Audit the resolved dependency tree of each component
        run: |
          status=0
          for requirements in orchestrator/requirements.txt sample-app/requirements.txt; do
            echo "::group::pip-audit ${requirements}"
            pip-audit --requirement "$requirements" --progress-spinner off || status=1
            echo "::endgroup::"
          done
          exit "$status"

  dependency-scan-snyk:
    name: Snyk (advisory)
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout code
        if: env.SNYK_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Snyk
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/python@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        continue-on-error: true
        with:
          args: --severity-threshold=high

  container-scan:
    name: Container scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [sample-app, orchestrator]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        env:
          IMAGE: ${{ matrix.image }}
        run: docker build -t "${IMAGE}:scan" "./${IMAGE}"

      - name: Report HIGH and CRITICAL findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: '0'

      - name: Upload results to the GitHub Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Fail on fixable CRITICAL findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  code-scan:
    name: Code scan (Bandit, blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit==1.9.4

      - name: Run Bandit
        run: |
          bandit -r sample-app/src/ orchestrator/src/ \
            -f json -o bandit-report.json \
            --severity-level medium

      - name: Upload scan results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-scan-results
          path: bandit-report.json
