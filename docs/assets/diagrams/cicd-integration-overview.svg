<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 590" width="1070" height="590" role="img" aria-labelledby="t d" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">CI/CD integration: how the workflows and the orchestrator fit together</title><desc id="d">A push or manual dispatch starts main-pipeline.yml, which calls build-and-test.yml, local-deployment-test.yml and, for manual dispatch to staging or production, deploy-environment.yml. build-and-test sends a webhook to the Orchestrator on build or test failure. deploy-environment sends an in_progress webhook with the workflow_run_id, deploys and verifies the app, then sends a success or failed webhook. The Orchestrator remembers successful versions as rollback targets and, on failure, retries by re-running the workflow through the GitHub API and finally rolls back.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#8A8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1070" height="590" rx="12" fill="#FCFBF9"/>
<rect x="200" y="14" width="240" height="44" rx="22" fill="#FFFFFF" stroke="#8C8A85" stroke-width="1.2"/>
<text x="320" y="41" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">push / manual dispatch</text>
<rect x="20" y="90" width="610" height="470" rx="16" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="40" y="118" font-size="15" font-weight="600" fill="#444441">main-pipeline.yml</text>
<path d="M320 58 V138" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="140" y="140" width="360" height="56" rx="10" fill="#FFFFFF" stroke="#D8D4CC" stroke-width="1.2"/>
<text x="320.0" y="165.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">build-and-test.yml</text>
<text x="320.0" y="183.0" text-anchor="middle" font-size="13" fill="#555555">build images, run tests</text>
<rect x="40" y="250" width="250" height="56" rx="10" fill="#FFFFFF" stroke="#D8D4CC" stroke-width="1.2"/>
<text x="165.0" y="275.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">local-deployment-test.yml</text>
<text x="165.0" y="293.0" text-anchor="middle" font-size="13" fill="#555555">deploy to a throwaway Kind cluster</text>
<path d="M165 196 V248" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="320" y="240" width="300" height="300" rx="16" fill="#FFFFFF" stroke="#8C8A85" stroke-width="1.2"/>
<text x="340" y="268" font-size="15" font-weight="600" fill="#444441">deploy-environment.yml</text>
<text x="340" y="286" font-size="12" fill="#666460">manual dispatch only: staging or production</text>
<path d="M470 196 V238" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="340" y="304" width="260" height="48" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="470.0" y="325.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Notify deployment start</text>
<text x="470.0" y="343.0" text-anchor="middle" font-size="13" fill="#666460">status: in_progress</text>
<rect x="340" y="382" width="260" height="60" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="470.0" y="400.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Deploy and verify</text>
<text x="470.0" y="418.0" text-anchor="middle" font-size="13" fill="#666460">kubectl set image + rollout</text>
<text x="470.0" y="435.0" text-anchor="middle" font-size="13" fill="#666460">health check + smoke tests</text>
<rect x="340" y="472" width="260" height="48" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="470.0" y="493.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Notify deployment result</text>
<text x="470.0" y="511.0" text-anchor="middle" font-size="13" fill="#666460">status: success | failed</text>
<path d="M470 352 V380" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M470 442 V470" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="830" y="110" width="220" height="450" rx="16" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="850" y="138" font-size="15" font-weight="600" fill="#3C3489">Orchestrator</text>
<text x="850" y="160" font-size="12" fill="#534AB7">POST /webhook/deployment</text>
<rect x="850" y="210" width="180" height="90" rx="10" fill="#E7F3EC" stroke="#4E9A6B" stroke-width="1.2"/>
<text x="940.0" y="243.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1F5C3A">on success</text>
<text x="940.0" y="261.0" text-anchor="middle" font-size="13" fill="#2F7A52">remember this version</text>
<text x="940.0" y="278.0" text-anchor="middle" font-size="13" fill="#2F7A52">as the rollback target</text>
<rect x="850" y="330" width="180" height="90" rx="10" fill="#FBECE8" stroke="#C0594A" stroke-width="1.2"/>
<text x="940.0" y="363.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7A2E1E">on failed</text>
<text x="940.0" y="381.0" text-anchor="middle" font-size="13" fill="#9A4636">retry: re-run this workflow,</text>
<text x="940.0" y="398.0" text-anchor="middle" font-size="13" fill="#9A4636">then roll back</text>
<path d="M502 168 H828" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="665" y="160" text-anchor="middle" font-size="13" fill="#55534F">webhook: build / test failure</text>
<path d="M602 328 H828" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="715" y="320" text-anchor="middle" font-size="13" fill="#55534F">carries workflow_run_id</text>
<text x="715" y="305" text-anchor="middle" font-size="13" fill="#55534F">webhook: in_progress</text>
<path d="M602 496 H828" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="715" y="488" text-anchor="middle" font-size="13" fill="#55534F">workflow_run_id</text>
<text x="715" y="473" text-anchor="middle" font-size="13" fill="#55534F">+ failure_type,</text>
<text x="715" y="458" text-anchor="middle" font-size="13" fill="#55534F">webhook: success | failed</text>
<path d="M828 420 H632" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr)"/>
<text x="730" y="412" text-anchor="middle" font-size="13" fill="#55534F">via the GitHub API</text>
<text x="730" y="397" text-anchor="middle" font-size="13" fill="#55534F">re-run workflow (retry)</text>
</svg>