<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" width="680" height="580" role="img" aria-labelledby="t d" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">MANA component map</title><desc id="d">GitHub Actions sends webhooks to the Orchestrator, which re-runs workflows, calls the Kubernetes API, stores state in Redis, exposes metrics to Prometheus and ships logs to Promtail. The monitoring stack feeds Grafana and Alertmanager, which notifies Slack, PagerDuty and email.</desc>
