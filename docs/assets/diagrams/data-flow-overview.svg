<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-labelledby="t d" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">MANA event-driven data flow</title><desc id="d">GitHub Actions sends an in_progress webhook and then a success or failed webhook to the Orchestrator. The Orchestrator reads and writes state in Redis, inspects and patches deployments through the Kubernetes API, and triggers a workflow re-run on GitHub Actions for retries.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#8A8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="820" height="330" rx="12" fill="#FCFBF9"/>
<rect x="20" y="90" width="150" height="120" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="95.0" y="147.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">GitHub Actions</text>
<text x="95.0" y="165.0" text-anchor="middle" font-size="13" fill="#666460">deploy job</text>
<rect x="330" y="90" width="140" height="120" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="400.0" y="155.0" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Orchestrator</text>
<rect x="660" y="30" width="140" height="56" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="730.0" y="55.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Redis</text>
<text x="730.0" y="73.0" text-anchor="middle" font-size="13" fill="#666460">state</text>
<rect x="660" y="214" width="140" height="56" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="730.0" y="247.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Kubernetes API</text>
<path d="M172 130 H328" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="250" y="121" text-anchor="middle" font-size="13" fill="#55534F">1. in_progress</text>
<path d="M172 178 H328" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="250" y="169" text-anchor="middle" font-size="13" fill="#55534F">2. success / failed</text>
<path d="M400 212 V270 H95 V212" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="250" y="262" text-anchor="middle" font-size="13" fill="#55534F">3. re-run workflow (retry)</text>
<path d="M472 126 H535 V58 H658" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="540" y="50" text-anchor="start" font-size="13" fill="#55534F">read / write state</text>
<path d="M472 174 H535 V242 H658" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="540" y="234" text-anchor="start" font-size="13" fill="#55534F">inspect / patch</text>
</svg>