<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 600" width="650" height="600" role="img" aria-labelledby="t d" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Retry path</title><desc id="d">A failure webhook loads or creates state, increments retry_count, computes the backoff and saves state as retry_scheduled. A background task waits and then posts a GitHub re-run workflow request. The re-run sends its own webhook: on success the version is recorded as the rollback target, on failure the process repeats or rolls back.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#8A8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="650" height="600" rx="12" fill="#FCFBF9"/>
<rect x="40.0" y="30" width="240" height="48" rx="24.0" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="160" y="59.0" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Failure webhook</text>
<rect x="40" y="104" width="240" height="48" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="160.0" y="133.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Load or create state</text>
<rect x="40" y="178" width="240" height="48" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="160.0" y="207.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">retry_count += 1</text>
<rect x="40" y="252" width="240" height="48" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="160.0" y="273.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Compute backoff</text>
<text x="160.0" y="291.0" text-anchor="middle" font-size="13" fill="#666460">exponential</text>
<path d="M160 78 V104" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M160 152 V178" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M160 226 V252" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M280 276.0 H320 V54 H358" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="360" y="30" width="240" height="48" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="480.0" y="51.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Save state</text>
<text x="480.0" y="69.0" text-anchor="middle" font-size="13" fill="#666460">retry_scheduled</text>
<rect x="350" y="104" width="260" height="182" rx="16" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="370" y="132" font-size="15" font-weight="600" fill="#444441">Background task</text>
<rect x="370" y="142" width="220" height="48" rx="10" fill="#FFFFFF" stroke="#D8D4CC" stroke-width="1.2"/>
<text x="480.0" y="171.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">Wait for the backoff</text>
<rect x="370" y="216" width="220" height="48" rx="10" fill="#FFFFFF" stroke="#D8D4CC" stroke-width="1.2"/>
<text x="480.0" y="237.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">POST re-run request</text>
<text x="480.0" y="255.0" text-anchor="middle" font-size="13" fill="#555555">GitHub re-run workflow API</text>
<path d="M480 78 V104" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M480 190 V216" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M480 286 V312" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="360" y="312" width="240" height="48" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="480.0" y="333.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Re-run sends a webhook</text>
<text x="480.0" y="351.0" text-anchor="middle" font-size="13" fill="#666460">its own: success or failed</text>
<path d="M480 360 V392" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<polygon points="480,392.0 595.0,440 480,488.0 365.0,440" fill="#FFF8E8" stroke="#C9A24B" stroke-width="1.3" stroke-linejoin="round"/>
<text x="480" y="436.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#6B4E10">Webhook</text>
<text x="480" y="453.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#6B4E10">status?</text>
<path d="M365 440 H225 V516" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="300" y="432" text-anchor="middle" font-size="13" fill="#55534F">success</text>
<path d="M480 488 V516" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="492" y="508" text-anchor="start" font-size="13" fill="#55534F">failed</text>
<rect x="95" y="518" width="260" height="48" rx="10" fill="#E7F3EC" stroke="#4E9A6B" stroke-width="1.2"/>
<text x="225.0" y="547.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1F5C3A">Record as rollback target</text>
<rect x="360" y="518" width="250" height="48" rx="10" fill="#FBECE8" stroke="#C0594A" stroke-width="1.2"/>
<text x="485.0" y="539.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7A2E1E">Repeat, or roll back</text>
<text x="485.0" y="557.0" text-anchor="middle" font-size="13" fill="#9A4636">once the limits are exceeded</text>
</svg>