<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 580" width="660" height="580" role="img" aria-labelledby="t d" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Rollback path</title><desc id="d">A failure webhook where retry_count exceeds the limits finds the previous version, saves state as rolling_back, patches the Deployment image and version labels, then waits for replicas to be ready and the application /health endpoint to answer. If healthy it saves rolled_back and audits rollback_completed; otherwise it saves failed and audits rollback_failed.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#8A8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="660" height="580" rx="12" fill="#FCFBF9"/>
<rect x="40.0" y="30" width="240" height="48" rx="24.0" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="160" y="59.0" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Failure webhook</text>
<rect x="40" y="104" width="240" height="48" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="160.0" y="125.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Limits exceeded</text>
<text x="160.0" y="143.0" text-anchor="middle" font-size="13" fill="#666460">retry_count over the thresholds</text>
<rect x="40" y="178" width="240" height="48" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="160.0" y="207.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Find previous version</text>
<rect x="40" y="252" width="240" height="48" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="160.0" y="273.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Save state</text>
<text x="160.0" y="291.0" text-anchor="middle" font-size="13" fill="#666460">rolling_back</text>
<path d="M160 78 V104" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M160 152 V178" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M160 226 V252" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M280 276 H322 V54 H373" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="375" y="30" width="240" height="48" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="495.0" y="51.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Patch Deployment</text>
<text x="495.0" y="69.0" text-anchor="middle" font-size="13" fill="#666460">image + version labels</text>
<rect x="375" y="150" width="240" height="48" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="495.0" y="171.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Wait for health</text>
<text x="495.0" y="189.0" text-anchor="middle" font-size="13" fill="#666460">replicas ready + app /health</text>
<path d="M495 78 V150" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M495 198 V292" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<polygon points="495,292.0 610.0,340 495,388.0 380.0,340" fill="#FFF8E8" stroke="#C9A24B" stroke-width="1.3" stroke-linejoin="round"/>
<text x="495" y="345.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#6B4E10">Healthy?</text>
<path d="M380 340 H215 V420" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="310" y="332" text-anchor="middle" font-size="13" fill="#55534F">healthy</text>
<path d="M495 388 V420" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="507" y="410" text-anchor="start" font-size="13" fill="#55534F">unhealthy</text>
<rect x="85" y="422" width="260" height="48" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
