<rect x="365" y="422" width="260" height="48" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="495.0" y="443.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Save state</text>
<text x="495.0" y="461.0" text-anchor="middle" font-size="13" fill="#666460">failed</text>
<path d="M215 470 V496" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M495 470 V496" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="85" y="498" width="260" height="48" rx="10" fill="#E7F3EC" stroke="#4E9A6B" stroke-width="1.2"/>
<text x="215.0" y="519.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1F5C3A">Audit event</text>
<text x="215.0" y="537.0" text-anchor="middle" font-size="13" fill="#2F7A52">rollback_completed</text>
<rect x="365" y="498" width="260" height="48" rx="10" fill="#FBECE8" stroke="#C0594A" stroke-width="1.2"/>
<text x="495.0" y="519.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7A2E1E">Audit event</text>
<text x="495.0" y="537.0" text-anchor="middle" font-size="13" fill="#9A4636">rollback_failed</text>
</svg>