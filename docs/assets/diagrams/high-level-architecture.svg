<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 530" width="910" height="530" role="img" aria-labelledby="t d" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">MANA high-level architecture</title><desc id="d">GitHub Actions sends deployment webhooks to the MANA Orchestrator (FastAPI, Python 3.12), which has a webhook receiver, decision engine, health verification, rollback executor, audit logger and a /metrics endpoint. The orchestrator calls the Kubernetes API, asks GitHub Actions to re-run workflows, stores state in Redis, and sends metrics and logs to the monitoring stack (Prometheus, Grafana, Loki, Alertmanager), which sends alerts to Slack, PagerDuty or email.</desc>
