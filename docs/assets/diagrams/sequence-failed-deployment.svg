<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 800" width="950" height="800" role="img" aria-labelledby="t d" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Failed deployment sequence</title><desc id="d">GitHub Actions posts status=failed to the Orchestrator. The Orchestrator writes audit events, loads state from Redis, resolves the previous version if there is no stored state, increments retry_count, then decides: retry by scheduling a workflow re-run after backoff, roll back by patching the Kubernetes Deployment image and labels, or alert by logging manual_intervention_required. It saves state with SETEX and replies 200 with the action taken.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#8A8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="950" height="800" rx="12" fill="#FCFBF9"/>
<line x1="95" y1="66" x2="95" y2="784" stroke="#CFCBC3" stroke-width="1.3" stroke-dasharray="5 5"/>
<line x1="340" y1="66" x2="340" y2="784" stroke="#CFCBC3" stroke-width="1.3" stroke-dasharray="5 5"/>
<line x1="600" y1="66" x2="600" y2="784" stroke="#CFCBC3" stroke-width="1.3" stroke-dasharray="5 5"/>
<line x1="850" y1="66" x2="850" y2="784" stroke="#CFCBC3" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="20.0" y="18" width="150" height="44" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="95.0" y="45.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">GitHub Actions</text>
<rect x="255.0" y="18" width="170" height="44" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="340.0" y="45.0" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Orchestrator</text>
<rect x="545.0" y="18" width="110" height="44" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="600.0" y="45.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Redis</text>
<rect x="770.0" y="18" width="160" height="44" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="850.0" y="45.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Kubernetes</text>
<path d="M95 118 H340" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="217.5" y="110" text-anchor="middle" font-size="13" fill="#55534F">failure_type, run_id</text>
<text x="217.5" y="95" text-anchor="middle" font-size="13" fill="#55534F">POST status=failed</text>
<rect x="215.0" y="140" width="250" height="50" rx="6" fill="#F3F0EA" stroke="#B9B4AA" stroke-width="1.2"/>
<text x="340" y="162" text-anchor="middle" font-size="13" fill="#444441">audit: deployment_received</text>
<text x="340" y="180" text-anchor="middle" font-size="13" fill="#444441">audit: failure_detected</text>
<path d="M340 222 H600" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="470.0" y="214" text-anchor="middle" font-size="13" fill="#55534F">load state: GET deployment:&lt;id&gt;</text>
<path d="M600 252 H340" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr)"/>
<text x="470.0" y="244" text-anchor="middle" font-size="13" fill="#55534F">stored state (or none)</text>
<rect x="215" y="274" width="725" height="106" rx="4" fill="none" stroke="#8C8A85" stroke-width="1.3"/>
<path d="M215 274 h46 v18 l-8 8 h-38 z" fill="#E8E4DC" stroke="#8C8A85" stroke-width="1.3" stroke-linejoin="round"/>
<text x="238" y="291" text-anchor="middle" font-size="12.5" font-weight="600" fill="#444441">opt</text>
<text x="272" y="292" font-size="13" fill="#55534F"><tspan font-weight="600" fill="#3C3489">[no stored state yet]</tspan> </text>
<path d="M340 328 H600" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="470.0" y="320" text-anchor="middle" font-size="13" fill="#55534F">GET last_successful:&lt;ns&gt;:&lt;app&gt;</text>
<path d="M340 366 H850" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="595.0" y="358" text-anchor="middle" font-size="13" fill="#55534F">fallback: read ReplicaSets</text>
<rect x="255.0" y="396" width="170" height="32" rx="6" fill="#F3F0EA" stroke="#B9B4AA" stroke-width="1.2"/>
<text x="340" y="418" text-anchor="middle" font-size="13" fill="#444441">retry_count += 1</text>
<rect x="10" y="450" width="930" height="240" rx="4" fill="none" stroke="#8C8A85" stroke-width="1.3"/>
<path d="M10 450 h46 v18 l-8 8 h-38 z" fill="#E8E4DC" stroke="#8C8A85" stroke-width="1.3" stroke-linejoin="round"/>
<text x="33" y="467" text-anchor="middle" font-size="12.5" font-weight="600" fill="#444441">alt</text>
<text x="108" y="468" font-size="13" fill="#55534F"><tspan font-weight="600" fill="#3C3489">[retry]</tspan> retry_count ≤ MAX_RETRIES</text>
<path d="M340 508 H95" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="217.5" y="500" text-anchor="middle" font-size="13" fill="#55534F">schedule re-run (after backoff)</text>
<line x1="10" y1="530" x2="940" y2="530" stroke="#8C8A85" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="108" y="550" font-size="13" fill="#55534F"><tspan font-weight="600" fill="#3C3489">[rollback]</tspan> retry_count &gt; ROLLBACK_THRESHOLD and a previous version is known</text>
<path d="M340 588 H850" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="595.0" y="580" text-anchor="middle" font-size="13" fill="#55534F">patch Deployment image + labels</text>
<line x1="10" y1="610" x2="940" y2="610" stroke="#8C8A85" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="108" y="630" font-size="13" fill="#55534F"><tspan font-weight="600" fill="#3C3489">[alert]</tspan> otherwise</text>
<rect x="210.0" y="646" width="260" height="32" rx="6" fill="#F3F0EA" stroke="#B9B4AA" stroke-width="1.2"/>
<text x="340" y="668" text-anchor="middle" font-size="13" fill="#444441">log manual_intervention_required</text>
<path d="M340 738 H600" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="470.0" y="730" text-anchor="middle" font-size="13" fill="#55534F">save state: SETEX deployment:&lt;id&gt;</text>
<path d="M340 782 H95" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr)"/>
<text x="217.5" y="774" text-anchor="middle" font-size="13" fill="#55534F">200 {action_taken}</text>
</svg>