<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" width="860" height="450" role="img" aria-labelledby="t d" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Successful deployment sequence</title><desc id="d">A developer pushes code. GitHub Actions builds, tests and pushes the image, updates the Kubernetes deployment, waits for rollout and health checks, then posts status=success to the Orchestrator. The Orchestrator stores the version as last_successful in Redis and replies 200 success.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#8A8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="860" height="450" rx="12" fill="#FCFBF9"/>
<line x1="90" y1="66" x2="90" y2="430" stroke="#CFCBC3" stroke-width="1.3" stroke-dasharray="5 5"/>
<line x1="280" y1="66" x2="280" y2="430" stroke="#CFCBC3" stroke-width="1.3" stroke-dasharray="5 5"/>
<line x1="510" y1="66" x2="510" y2="430" stroke="#CFCBC3" stroke-width="1.3" stroke-dasharray="5 5"/>
<line x1="770" y1="66" x2="770" y2="430" stroke="#CFCBC3" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="30.0" y="18" width="120" height="44" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="90.0" y="45.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Developer</text>
<rect x="205.0" y="18" width="150" height="44" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="280.0" y="45.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">GitHub Actions</text>
<rect x="435.0" y="18" width="150" height="44" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="510.0" y="45.0" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Orchestrator</text>
<rect x="715.0" y="18" width="110" height="44" rx="10" fill="#F3F0EA" stroke="#8C8A85" stroke-width="1.2"/>
<text x="770.0" y="45.0" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Redis</text>
<path d="M90 120 H280" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="185.0" y="112" text-anchor="middle" font-size="13" fill="#55534F">push</text>
<rect x="160.0" y="148" width="240" height="68" rx="6" fill="#F3F0EA" stroke="#B9B4AA" stroke-width="1.2"/>
<text x="280" y="170" text-anchor="middle" font-size="13" fill="#444441">build, test, push image</text>
<text x="280" y="188" text-anchor="middle" font-size="13" fill="#444441">kubectl set image</text>
<text x="280" y="206" text-anchor="middle" font-size="13" fill="#444441">rollout + health check</text>
<path d="M280 262 H510" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="395.0" y="254" text-anchor="middle" font-size="13" fill="#55534F">POST status=success</text>
<path d="M510 336 H770" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="640.0" y="328" text-anchor="middle" font-size="13" fill="#55534F">= version</text>
<text x="640.0" y="313" text-anchor="middle" font-size="13" fill="#55534F">SET last_successful:&lt;ns&gt;:&lt;app&gt;</text>
<path d="M510 404 H280" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr)"/>
<text x="395.0" y="396" text-anchor="middle" font-size="13" fill="#55534F">200 success</text>
</svg>