<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" role="img" aria-labelledby="t d" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Deployment status lifecycle</title><desc id="d">A deployment has no state until the first failed webhook. It then moves to retry_scheduled, which repeats while retries remain, becomes success on a success webhook, moves to rolling_back when retries are exhausted and a previous version is known, and ends in rolled_back if the rollback is healthy. Alert paths and unhealthy rollbacks end in failed.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#8A8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="980" height="440" rx="12" fill="#FCFBF9"/>
<circle cx="48" cy="220" r="8" fill="#444441"/>
<text x="48" y="190" text-anchor="middle" font-size="13" fill="#55534F">(no state)</text>
<rect x="150" y="195" width="180" height="50" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="240.0" y="225.0" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">retry_scheduled</text>
<rect x="520" y="195" width="180" height="50" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="610.0" y="225.0" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">rolling_back</text>
<rect x="800" y="195" width="160" height="50" rx="10" fill="#E7F3EC" stroke="#4E9A6B" stroke-width="1.2"/>
<text x="880.0" y="225.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1F5C3A">rolled_back</text>
<rect x="150" y="60" width="180" height="50" rx="10" fill="#E7F3EC" stroke="#4E9A6B" stroke-width="1.2"/>
<text x="240.0" y="90.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1F5C3A">success</text>
<rect x="490" y="350" width="240" height="62" rx="10" fill="#FBECE8" stroke="#C0594A" stroke-width="1.2"/>
<text x="610.0" y="378.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7A2E1E">failed</text>
<text x="610.0" y="396.0" text-anchor="middle" font-size="13" fill="#9A4636">manual_intervention_required</text>
<path d="M58 220 H148" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="106" y="210" text-anchor="middle" font-size="13" fill="#55534F">failed webhook</text>
<path d="M332 220 H518" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="425" y="208" text-anchor="middle" font-size="13" fill="#55534F">retries exhausted,</text>
<text x="425" y="238" text-anchor="middle" font-size="13" fill="#55534F">previous version known</text>
<path d="M702 220 H798" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="750" y="208" text-anchor="middle" font-size="13" fill="#55534F">rollback</text>
<text x="750" y="238" text-anchor="middle" font-size="13" fill="#55534F">healthy</text>
<path d="M180 195 V112" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="168" y="158" text-anchor="end" font-size="13" fill="#55534F">success webhook</text>
<path d="M265 195 C265 148, 315 148, 315 195" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="325" y="160" text-anchor="start" font-size="13" fill="#55534F">re-run fails: retry again</text>
<path d="M610 247 V348" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="622" y="306" text-anchor="start" font-size="13" fill="#55534F">rollback unhealthy</text>
<path d="M48 230 V381 H488" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="368" y="372" text-anchor="middle" font-size="13" fill="#55534F">or no previous version</text>
<text x="368" y="357" text-anchor="middle" font-size="13" fill="#55534F">alert: no workflow_run_id</text>
<path d="M240 247 V381" fill="none" stroke="#8A8984" stroke-width="2" stroke-linejoin="round"/>
</svg>