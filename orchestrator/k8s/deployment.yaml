apiVersion: v1
kind: Namespace
metadata:
  name: orchestrator
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: orchestrator
  labels:
    app: orchestrator
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      serviceAccountName: orchestrator-sa
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: orchestrator
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: orchestrator
        image: orchestrator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: orchestrator-secrets
              key: redis-password
        - name: WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: orchestrator-secrets
              key: webhook-secret
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: orchestrator-secrets
              key: api-key
        - name: MAX_RETRIES
          value: "3"
        - name: INITIAL_BACKOFF
          value: "10.0"
        - name: MAX_BACKOFF
          value: "300.0"
        - name: BACKOFF_MULTIPLIER
          value: "2.0"
        - name: HEALTH_CHECK_TIMEOUT
          value: "5"
        - name: HEALTH_CHECK_PORT
          value: "5000"
        - name: HEALTH_CHECK_PATH
          value: "/health"
        - name: LOG_LEVEL
          value: "INFO"
        - name: ENABLE_AUDIT_LOGGING
          value: "true"
        - name: PORT
          value: "8000"
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-token
              key: token
        - name: GITHUB_REPO
          value: "othaime-en/mana"  # REPLACE THIS
        - name: JOB_LEASE_SECONDS
          value: "60"
        - name: SHUTDOWN_GRACE_SECONDS
          value: "30"
        - name: WATCHER_ENABLED
          value: "true"
        - name: WATCHER_NAMESPACES
          value: "production,staging"
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: slack-webhook
              key: url
              optional: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /livez
            port: 8000
          periodSeconds: 5
          failureThreshold: 24
        livenessProbe:
          httpGet:
            path: /livez
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          periodSeconds: 5
          timeoutSeconds: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-service
  namespace: orchestrator
spec:
  selector:
    app: orchestrator
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator-sa
  namespace: orchestrator
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orchestrator-pdb
  namespace: orchestrator
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: orchestrator
