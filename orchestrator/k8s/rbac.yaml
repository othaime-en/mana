# Namespaced access for the orchestrator; create these namespaces before applying.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mana-orchestrator
  namespace: production
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mana-orchestrator
  namespace: production
subjects:
  - kind: ServiceAccount
    name: orchestrator-sa
    namespace: orchestrator
roleRef:
  kind: Role
  name: mana-orchestrator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mana-orchestrator
  namespace: staging
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mana-orchestrator
  namespace: staging
subjects:
  - kind: ServiceAccount
    name: orchestrator-sa
    namespace: orchestrator
roleRef:
  kind: Role
  name: mana-orchestrator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mana-orchestrator
  namespace: canary
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mana-orchestrator
  namespace: canary
subjects:
  - kind: ServiceAccount
